version: 2

models:
  - name: int_opportunity_enriched
    description: Opportunities joined with accounts, users, campaigns and stage seed.
    columns:
      - name: opportunity_id
        tests:
          - unique
          - not_null
      - name: opportunity_outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Won', 'Lost', 'Open']

  - name: int_case_enriched
    description: Cases joined with accounts, contacts, users and case history.
    columns:
      - name: case_id
        tests:
          - unique
          - not_null
      - name: case_status
        tests:
          - not_null

  - name: int_lead_enriched
    description: Leads joined with users and lead status seed.
    columns:
      - name: lead_id
        tests:
          - unique
          - not_null
      - name: lead_lifecycle_stage
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Converted', 'Deleted', 'Active']