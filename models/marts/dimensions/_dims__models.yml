version: 2

models:
  - name: dim_account
    description: Account dimension with SLA fields, billing location and owner.
    columns:
      - name: account_sk
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - unique
          - not_null
      - name: account_name
        tests:
          - not_null
      - name: owner_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id

  - name: dim_contact
    description: Contact dimension with mailing address and account name.
    columns:
      - name: contact_sk
        tests:
          - unique
          - not_null
      - name: contact_id
        tests:
          - unique
          - not_null
      - name: full_name
        tests:
          - not_null
      - name: account_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id

  - name: dim_user
    description: User dimension with role, locale and manager hierarchy.
    columns:
      - name: user_sk
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - unique
          - not_null
      - name: full_name
        tests:
          - not_null
      - name: username
        tests:
          - unique
          - not_null
      - name: is_active
        tests:
          - not_null

  - name: dim_campaign
    description: Campaign dimension with budget, performance metrics and derived rates.
    columns:
      - name: campaign_sk
        tests:
          - unique
          - not_null
      - name: campaign_id
        tests:
          - unique
          - not_null
      - name: campaign_name
        tests:
          - not_null

  - name: dim_product
    description: Product dimension enriched with aggregated pricebook pricing.
    columns:
      - name: product_sk
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_name
        tests:
          - not_null
      - name: is_active
        tests:
          - not_null

  - name: dim_date
    description: Date dimension from min_date to max_date generated by dbt_date.
    columns:
      - name: date_day
        tests:
          - unique
          - not_null